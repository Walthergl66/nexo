services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nexo-backend
    working_dir: /var/www/html
    env_file:
      - ./backend/.env
    environment:
      APP_URL: http://localhost:8010
      DB_PERSISTENT: "true"
    volumes:
      - ./backend:/var/www/html
      - ./docs:/var/www/docs:ro
      - backend-vendor:/var/www/html/vendor
    networks:
      - nexo

  backend-web:
    image: nginx:1.27-alpine
    container_name: nexo-backend-web
    depends_on:
      - backend
    ports:
      - "8010:80"
    volumes:
      - ./backend:/var/www/html:ro
      - ./docker/nginx/backend.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - nexo

networks:
  nexo:

volumes:
  backend-vendor:
